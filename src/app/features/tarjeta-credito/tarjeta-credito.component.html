<div class="row mt-4">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h5 class="titulo">AGREGAR TARJETA</h5>
      </div>
      
      <form [formGroup]="form" (ngSubmit)="agregarTarjeta()">
        
        <div class="input-group input-group-lg mb-3">
          <span class="input-group-text">
            <i class="fas fa-user"
               [class.green-icon]="form.get('titular')?.valid"
               [class.red-icon]="form.get('titular')?.invalid && form.get('titular')?.touched"></i>
          </span>
          <input formControlName="titular" type="text" class="form-control" placeholder="Titular">
        </div>

        <div class="input-group input-group-lg mb-3">
          <span class="input-group-text">
            <i class="fas fa-credit-card"
               [class.green-icon]="form.get('numeroTarjeta')?.valid"
               [class.red-icon]="form.get('numeroTarjeta')?.invalid && form.get('numeroTarjeta')?.touched"></i>
          </span>
          <input formControlName="numeroTarjeta" maxlength="16" type="text" class="form-control" placeholder="Numero Tarjeta">
        </div>

        <div class="row">
          <div class="col-lg-7">
            <div class="input-group input-group-lg mb-3">
              <span class="input-group-text">
                <i class="fas fa-calendar-alt"
                   [class.green-icon]="form.get('fechaExpiracion')?.valid"
                   [class.red-icon]="form.get('fechaExpiracion')?.invalid && form.get('fechaExpiracion')?.touched"></i>
              </span>
              <input formControlName="fechaExpiracion" maxlength="5" type="text" class="form-control" placeholder="MM/YY">
            </div>
          </div>
          
          <div class="col-lg-5">
            <div class="input-group input-group-lg mb-3">
              <span class="input-group-text">
                <i class="fas fa-key"
                   [class.green-icon]="form.get('cvv')?.valid"
                   [class.red-icon]="form.get('cvv')?.invalid && form.get('cvv')?.touched"></i>
              </span>
              <input formControlName="cvv" maxlength="3" type="password" class="form-control" placeholder="CVV">
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button [disabled]="this.form.invalid" type="submit" class="btn btn-success btn-lg">
            <i class="fas fa-database"></i>&nbsp; {{ editingTarjetaId ? 'Actualizar' : 'Aceptar' }}
          </button>
        </div>
        <div class="d-grid gap-2 mt-2" *ngIf="editingTarjetaId !== null">
          <button type="button" class="btn btn-secondary btn-lg" (click)="cancelarEdicion()">
            Cancelar edición
          </button>
        </div>

      </form>

      <div class="modal-backdrop" *ngIf="mostrarModal">
        <div class="modal-card">
          <button class="modal-close" type="button" (click)="closeModal()">×</button>
          <h5>{{ modalTitle }}</h5>
          <p>{{ mensajeExito }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h5 class="titulo">LISTADO DE TARJETAS</h5>
        
        <table class="table">
          <tbody>
            <tr *ngFor="let tarjeta of listTarjetas; let i = index">
              <td>{{ tarjeta.titular }}</td>
              <td>{{ tarjeta.numeroTarjeta }}</td>
              <td>{{ tarjeta.fechaExpiracion }}</td>
              <!-- <td>{{ tarjeta.cvv }}</td> -->
              <td>
                <i class="far fa-edit text-info" style="cursor: pointer;" (click)="editarTarjeta(tarjeta)"></i>
                <i (click)="showConfirmDelete(tarjeta.id, i)" class="far fa-trash-alt text-danger ms-2" style="cursor: pointer;"></i>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
  </div>
</div>

<!-- Confirmación de eliminación -->
<div class="modal-backdrop" *ngIf="confirmVisible">
  <div class="modal-card">
    <button class="modal-close" type="button" (click)="cancelConfirm()">×</button>
    <h5>Confirmar eliminación</h5>
    <p>{{ confirmMessage }}</p>
    <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
      <button class="btn btn-danger" type="button" (click)="confirmDelete()">Eliminar</button>
      <button class="btn btn-secondary" type="button" (click)="cancelConfirm()">Cancelar</button>
    </div>
  </div>
</div>
